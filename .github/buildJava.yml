name: Java CI with Maven - Test and package
on: 
  pull_request:
    branches: [main]
jobs:
  # Job : 
  test:
    runs-on: ubuntu-latest
    steps:
      #Actions
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: 
          distribution: corretto
          java-version: 21
          cache: maven
      
      - run: java --version
      - run: mvn -B package
